<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TAQVION Reviews</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FA;--card:#fff;--tx:#020B2D;--mut:#5b6685;--bd:#e1e7f1;--ac:#12D9FF;--ac2:#E8FCFF;--err:#d93b3b;--sh:0 10px 40px rgba(2,11,45,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#020B2D;--card:#0a1745;--tx:#fff;--mut:#9fb0d6;--bd:#1b2b63;--ac2:#0d2a5a;--err:#ff7b7b;--sh:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#020B2D;--card:#0a1745;--tx:#fff;--mut:#9fb0d6;--bd:#1b2b63;--ac2:#0d2a5a;--err:#ff7b7b;--sh:none;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit;color:inherit}
nav{background:#020B2D;display:flex;justify-content:space-between;align-items:center;padding:12px max(20px,calc(50% - 560px));position:sticky;top:env(safe-area-inset-top,0px);z-index:9}nav img{height:32px;display:block}
.tg{background:none;border:1px solid #1b2b63;color:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font-size:.85rem}
.hero{background:#020B2D;color:#fff;background-image:radial-gradient(600px 300px at 80% 0,rgba(18,217,255,.16),transparent)}
.hw{max-width:1120px;margin:0 auto;padding:64px 20px 90px;display:grid;gap:40px;grid-template-columns:1.15fr .85fr;align-items:center}@media(max-width:860px){.hw{grid-template-columns:1fr;padding:40px 20px 60px}}
.pill{display:inline-block;border:1px solid #1b2b63;color:#12D9FF;border-radius:99px;padding:4px 14px;font-size:.78rem;letter-spacing:.12em;font-weight:600}
h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.02;letter-spacing:-.035em;font-weight:800;margin:18px 0}h1 em{font-style:normal;color:#12D9FF}
.sub{color:#b4c2e6;font-size:1.12rem;max-width:520px}.mut{color:var(--mut)}
.btn{background:var(--ac);color:#020B2D;border:0;border-radius:12px;padding:14px 28px;font-weight:700;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(18,217,255,.35)}.btn.s{background:transparent;color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn:disabled{opacity:.5}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;box-shadow:var(--sh)}
.rc{color:var(--tx);text-align:center;padding:30px 24px}.rc h3{margin:0 0 4px}
.stars{display:flex;gap:6px;justify-content:center}.st{background:none;border:0;font-size:2.6rem;line-height:1;color:var(--bd);cursor:pointer;padding:2px;transition:.15s}.st:hover{transform:scale(1.2)}.st.on{color:#12D9FF;text-shadow:0 0 18px rgba(18,217,255,.45)}
.sm .st{font-size:1.6rem}.lb{height:1.6em;font-weight:700;color:var(--ac);margin-top:6px}
.stats{max-width:1120px;margin:-40px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stats b{font-size:1.9rem;display:block;letter-spacing:-.02em}
.sec{max-width:1120px;margin:0 auto;padding:56px 20px}.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.fl{max-width:720px;margin:0 auto;padding:28px 16px 70px}.steps{display:flex;gap:8px;margin-bottom:18px}.steps i{flex:1;height:5px;border-radius:5px;background:var(--bd)}.steps i.d{background:var(--ac)}
.in{animation:up .4s ease}@keyframes up{from{opacity:0;transform:translateY(12px)}}
h2{font-size:1.7rem;letter-spacing:-.02em;margin:0 0 4px}label.f{display:block;margin:14px 0 5px;font-weight:600;font-size:.88rem}.req{color:var(--err)}
.i,textarea{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)}textarea{min-height:96px;resize:vertical}.i:focus,textarea:focus{border-color:var(--ac)}
.two{display:grid;gap:0 14px;grid-template-columns:1fr 1fr}@media(max-width:600px){.two{grid-template-columns:1fr}.st{font-size:2.3rem}}
.ch{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:99px;padding:8px 16px;background:var(--bg);cursor:pointer;margin:0 6px 8px 0;font-size:.92rem;transition:.15s}.ch:has(input:checked){border-color:var(--ac);background:var(--ac2);font-weight:600}.ch input{accent-color:#12D9FF}.ch.b{display:flex;border-radius:12px;margin-right:0}
.err{color:var(--err);font-size:.8rem;min-height:1.1em}details{margin-top:16px;border:1px dashed var(--bd);border-radius:12px;padding:12px 16px}summary{cursor:pointer;font-weight:600}
.rr{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0}
.nav{display:flex;justify-content:space-between;margin-top:22px}.sum{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:.92rem}.sum dt{color:var(--mut)}.sum dd{margin:0;word-break:break-word}
.ref{font:700 1.6rem ui-monospace,monospace;color:#12D9FF;background:#020B2D;display:inline-block;padding:10px 20px;border-radius:12px;margin:8px 0}.note{background:var(--ac2);border-left:3px solid var(--ac);padding:12px 16px;border-radius:10px;font-size:.9rem;margin:16px 0}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:24px}footer a{color:inherit}
</style></head><body>

const LEAD=["Yes, contact me","I want a free demo","I want pricing information","I want a consultation","Not right now"];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=ls.get("tq_draft",{svc:[],r:{},tags:[],step:0}),step=0,errs={};const save=()=>{S.step=step;ls.set("tq_draft",S)};
const digits=s=>String(s||"").replace(/\D/g,""),svcs=()=>S.svc.map(s=>s=="Other"&&S.other?"Other: "+S.other:s).join(", ");
const stars=(k,cls="")=>`<div class="stars ${cls}" role="radiogroup" aria-label="${k}">${[1,2,3,4,5].map(n=>`<button type="button" class="st ${(S.r[k]||0)>=n?"on":""}" role="radio" aria-checked="${S.r[k]==n}" aria-label="${n} star${n>1?"s":""} – ${LB[n]}" data-r="${k}" data-n="${n}">★</button>`).join("")}</div>`;
function landing(){const a=ls.get("tq_reviews",[]),avg=a.length?(a.reduce((s,x)=>s+(x.r.overall||0),0)/a.length).toFixed(1):"–";
$("#app").innerHTML=`<div class="hero"><div class="hw"><div><span class="pill">CLIENT REVIEW PORTAL</span><h1>YOUR EXPERIENCE<br><em>MATTERS TO US.</em></h1><p class="sub">Help TAQVION improve technology through your valuable feedback, reviews and suggestions.</p><button class="btn" id="go">Start Your Review →</button> <span style="color:#9fb0d6;margin-left:12px;font-size:.9rem">⏱ Takes about 2–3 minutes</span></div>
<div class="card rc"><img src="${ICON}" alt="TAQVION" width="56" height="56" style="border-radius:12px"><h3>How was your experience?</h3><p class="mut" style="margin:0 0 12px;font-size:.9rem">Tap a star to begin</p>${stars("overall")}<div class="lb"></div></div></div></div>
<div class="stats"><div class="card"><b>${a.length||"–"}</b><span class="mut">Reviews received</span></div><div class="card"><b>${avg}${a.length?" ★":""}</b><span class="mut">Average rating</span></div><div class="card"><b>${SV.length-1}</b><span class="mut">Services covered</span></div></div>
<div class="sec"><h2>Tell us about the TAQVION services you use</h2><p class="mut">ERP, HMS, AI and custom software – every review shapes what we build next.</p><div class="g" style="margin-top:18px">${SV.slice(0,-1).map(s=>`<div class="card" style="padding:16px;font-weight:600">${s}</div>`).join("")}</div></div>`;
$("#go").onclick=()=>{step=0;form()};document.querySelectorAll(".rc .st").forEach(b=>{b.onclick=()=>{S.r.overall=+b.dataset.n;save();step=0;form()};b.onmouseenter=()=>$(".lb").textContent=LB[b.dataset.n]})}
const inp=(k,l,t="text",ph="")=>`<div><label class="f" for="${k}">${l} <span class="req">*</span></label><input class="i" id="${k}" type="${t}" placeholder="${ph}" value="${esc(S[k])}" data-k="${k}" autocomplete="off"><div class="err">${errs[k]||""}</div></div>`;
const ta=(k,l,ph="")=>`<label class="f" for="${k}">${l}</label><textarea id="${k}" placeholder="${ph}" data-k="${k}">${esc(S[k])}</textarea>`;
const rad=(k,o)=>`<div>${o.map(x=>`<label class="ch"><input type="radio" name="${k}" value="${esc(x)}" data-k="${k}" ${S[k]===x?"checked":""}>${x}</label>`).join("")}</div><div class="err">${errs[k]||""}</div>`;
const body=()=>[
()=>`<h2>How was your experience?</h2><p class="mut">Rate, pick what stood out, and say it your way.</p><div style="padding:14px 0 4px">${stars("overall")}<div class="lb" style="text-align:center">${S.r.overall?LB[S.r.overall]:""}</div><div class="err" style="text-align:center">${errs.r||""}</div></div>
<label class="f">What stood out? (optional)</label>${TAGS.map(t=>`<label class="ch"><input type="checkbox" data-tag="${t}" ${S.tags.includes(t)?"checked":""}>${t}</label>`).join("")}
${inp("title","Review title","text","Sum it up in a few words")}<label class="f" for="exp">Your review <span class="req">*</span></label><textarea id="exp" data-k="exp" placeholder="Tell us about your experience with TAQVION…">${esc(S.exp)}</textarea><div class="err">${errs.exp||""}</div>
<details><summary>Add more detail (optional)</summary>${ta("like","What did you like about TAQVION?")}${ta("solved","What problem did our service solve for your business?")}${ta("improve","What can we improve?")}${ta("sugg","Suggestions and recommendations")}${ta("more","Additional comments")}<label class="f">Rate in detail</label>${RT.map(([k,l])=>`<div class="rr"><span>${l}</span>${stars(k,"sm")}</div>`).join("")}</details>`,
()=>`<h2>Which services?</h2><p class="mut">Select every TAQVION service this review covers.</p><div style="margin-top:14px">${SV.map(s=>`<label class="ch"><input type="checkbox" data-svc="${esc(s)}" ${S.svc.includes(s)?"checked":""}>${s}</label>`).join("")}</div><div class="err">${errs.svc||""}</div>${S.svc.includes("Other")?inp("other","Other service"):""}
<label class="f">Want to explore more with TAQVION? <span class="req">*</span></label>${rad("lead",LEAD)}<label class="f">Preferred contact method <span class="req">*</span></label>${rad("contact",["WhatsApp","Phone Call","Email"])}`,
()=>`<h2>About you</h2><p class="mut">So we can follow up. Your details stay private.</p><div class="two">${inp("name","Full name")}${inp("mobile","Mobile number","tel","+91 98765 43210")}</div><label class="ch" style="margin-top:10px"><input type="checkbox" id="same" ${S.same?"checked":""}> WhatsApp number is same as mobile</label>${S.same?"":inp("wa","WhatsApp number","tel")}<div class="two">${inp("email","Email address","email")}${inp("company","Business / company")}${inp("industry","Occupation / industry")}${inp("role","Designation / role")}${inp("city","City / location")}${inp("state","State")}</div>${inp("country","Country")}<label class="f">Interested in TAQVION services? <span class="req">*</span></label>${rad("interest",["Yes","No","Maybe"])}<label class="f">You are a <span class="req">*</span></label>${rad("ctype",["Existing client","Potential client"])}`,
()=>{const v=(l,x)=>x?`<dt>${l}</dt><dd>${esc(x)}</dd>`:"";return`<h2>Almost done</h2><p class="mut">Check your review, then submit.</p><dl class="sum card" style="box-shadow:none;margin:14px 0">${v("Rating",S.r.overall+"/5 – "+LB[S.r.overall])}${v("Title",S.title)}${v("Review",S.exp)}${v("Services",svcs())}${v("Name",S.name)}${v("Contact",S.mobile+" · "+S.email)}${v("Business",S.company+", "+S.city)}${v("Interest",S.lead+" via "+S.contact)}</dl><div style="display:flex;gap:8px;flex-wrap:wrap">${["Edit review","Edit services","Edit details"].map((t,i)=>`<button class="btn s" style="padding:8px 16px" data-edit="${i}">${t}</button>`).join("")}</div>
<label class="ch b" style="margin-top:16px;border-radius:12px"><input type="checkbox" id="consent" ${S.consent?"checked":""}><span>I confirm this information is accurate and may be used according to the published privacy policy. <span class="req">*</span></span></label><div class="err">${errs.consent||""}</div><label class="ch b" style="border-radius:12px"><input type="checkbox" id="pub" ${S.pub?"checked":""}><span>(Optional) TAQVION may publish my review as a testimonial. Private details are never shown.</span></label>`}][step]();
function validate(){errs={};const R=k=>{if(!String(S[k]||"").trim())errs[k]="Required"};
if(step==0){if(!S.r.overall)errs.r="Please choose a star rating";R("title");R("exp")}
if(step==1){if(!S.svc.length)errs.svc="Select at least one service";if(S.svc.includes("Other"))R("other");R("lead");R("contact")}
if(step==2){["name","company","industry","role","city","state","country","interest","ctype"].forEach(R);const m=digits(S.mobile);if(m.length<10||m.length>13)errs.mobile="Enter a valid mobile number";if(!S.same){const w=digits(S.wa);if(w.length<10||w.length>13)errs.wa="Enter a valid WhatsApp number"}if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(S.email||""))errs.email="Enter a valid email"}
if(step==3&&!S.consent)errs.consent="Consent is required to submit";return !Object.keys(errs).length}
function form(){save();$("#app").innerHTML=`<div class="fl"><div class="steps">${[0,1,2,3].map(i=>`<i class="${i<=step?"d":""}"></i>`).join("")}</div><div class="mut" style="font-size:.8rem;margin-bottom:10px">Step ${step+1} of 4 · progress saved automatically</div><div class="card in" id="box">${body()}</div><div class="nav"><button class="btn s" id="bk">← ${step?"Back":"Home"}</button><button class="btn" id="nx">${step==3?"Submit review":"Continue →"}</button></div></div>`;wire();scrollTo({top:0})}
function wire(){const b=$("#box");
b.querySelectorAll("[data-k]").forEach(e=>e.oninput=e.onchange=()=>{S[e.dataset.k]=e.value;save()});
b.querySelectorAll("[data-svc]").forEach(e=>e.onchange=()=>{const v=e.dataset.svc;S.svc=e.checked?[...S.svc,v]:S.svc.filter(x=>x!=v);save();if(v=="Other")form()});
b.querySelectorAll("[data-tag]").forEach(e=>e.onchange=()=>{const v=e.dataset.tag;S.tags=e.checked?[...S.tags,v]:S.tags.filter(x=>x!=v);save()});
b.querySelectorAll("[data-r]").forEach(e=>e.onclick=()=>{const o=b.querySelector("details")?.open;S.r[e.dataset.r]=+e.dataset.n;save();form();if(o)b.querySelector("details").open=true});
b.querySelectorAll("[data-edit]").forEach(e=>e.onclick=()=>{step=+e.dataset.edit;form()});
const sm=$("#same");if(sm)sm.onchange=()=>{S.same=sm.checked;save();form()};
const c=$("#consent");if(c)c.onchange=()=>{S.consent=c.checked;save()};const p=$("#pub");if(p)p.onchange=()=>{S.pub=p.checked;save()};
$("#bk").onclick=()=>step?(step--,form()):landing();
$("#nx").onclick=()=>{if(!validate()){form();document.querySelector(".err:not(:empty)")?.scrollIntoView({block:"center"});return}step==3?submit():(step++,form())}}
function msg(ref){const w=(a,b)=>`*${a}:* ${b||"-"}`;return["*TAQVION CLIENT REVIEW* ("+ref+")",w("Name",S.name),w("Mobile",S.mobile),w("WhatsApp",S.same?S.mobile:S.wa),w("Email",S.email),w("Business",S.company),w("Occupation",S.industry),w("Location",[S.city,S.state,S.country].join(", ")),w("Services",svcs()),w("Service interest",S.lead+" ("+S.interest+", "+S.ctype+")"),w("Overall rating",S.r.overall+"/5 – "+LB[S.r.overall]),w("Individual ratings",RT.map(([k,l])=>l+" "+(S.r[k]||"-")+"/5").join("; ")),w("Review title",S.title),w("Review",S.exp),w("Liked",S.like),w("Problem solved",S.solved),w("Improve",S.improve),w("Suggestions",S.sugg),w("Comments",S.more),w("Tags",S.tags.join(", ")),w("Publish testimonial",S.pub?"Yes":"No"),w("Preferred contact",S.contact)].join("\n")}
async function submit(){const key=digits(S.mobile)+"|"+S.title.trim().toLowerCase(),sent=ls.get("tq_sent",[]);
if(sent.includes(key)){$("#box").insertAdjacentHTML("afterbegin",'<div class="note">This review was already submitted from this device.</div>');return}
const nb=$("#nx");nb.disabled=true;nb.textContent="Submitting…";
const ref="TQV-"+new Date().toISOString().slice(2,10).replace(/-/g,"")+"-"+Math.random().toString(36).slice(2,7).toUpperCase(),rec={ref,at:new Date().toISOString(),...S,services:svcs()};let ok=false;
if(ENDPOINT){try{ok=(await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(rec)})).ok}catch(e){}}
const all=ls.get("tq_reviews",[]);all.push(rec);ls.set("tq_reviews",all);sent.push(key);ls.set("tq_sent",sent);localStorage.removeItem("tq_draft");
const url="https://wa.me/"+WA+"?text="+encodeURIComponent(msg(ref)),mail="mailto:"+MAIL+"?subject="+encodeURIComponent("TAQVION Review "+ref)+"&body="+encodeURIComponent(msg(ref).replace(/\*/g,""));
window.open(url,"_blank","noopener");
$("#app").innerHTML=`<div class="fl in" style="text-align:center"><div class="card" style="padding:40px 24px"><img src="${ICON}" alt="TAQVION" width="64" height="64" style="border-radius:14px"><h1 style="font-size:clamp(1.8rem,5vw,2.6rem)">THANK YOU FOR<br><em style="color:#12D9FF">TRUSTING TAQVION!</em></h1><p class="mut">Your feedback helps us build better technology and create meaningful business solutions.</p><div class="mut" style="font-size:.8rem;letter-spacing:.12em">REVIEW REFERENCE ID</div><div class="ref">${ref}</div>
<div class="note" style="text-align:left"><b>One last step:</b> WhatsApp opened with your review pre-filled. It is <b>not sent yet</b> – please press <b>Send</b> to deliver it to TAQVION.</div>
<a class="btn" href="${url}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">Open WhatsApp again</a> <a class="btn s" href="${mail}" style="text-decoration:none;display:inline-block">Send by email</a> <button class="btn s" id="dn">Done</button>
<p class="mut" style="font-size:.82rem">${ok?"Also saved to the TAQVION server.":"Server delivery is not connected yet; your review is stored on this device."}</p></div></div>`;$("#dn").onclick=()=>{S={svc:[],r:{},tags:[],step:0};landing()}}
const th=ls.get("tq_theme",null);if(th)document.documentElement.dataset.theme=th;
$("#tg").onclick=()=>{const d=document.documentElement,dk=getComputedStyle(d).colorScheme=="dark";d.dataset.theme=dk?"light":"dark";ls.set("tq_theme",d.dataset.theme)};
landing();
</script></body></html>
